<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#534AB7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GuruIndo">
  <meta name="description" content="Sekolah dan rumah, satu hati">
  <title>GuruIndo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="splash-page">
  <div class="splash-wrap">
    <!-- Logo GuruIndo -->
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
      <rect width="72" height="72" rx="18" fill="rgba(255,255,255,0.15)"/>
      <path d="M20 54 L36 22 L52 54" stroke="white" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M28 42 L44 42" stroke="white" stroke-width="4" stroke-linecap="round"/>
      <circle cx="36" cy="60" r="4" fill="#1D9E75"/>
    </svg>

    <h1 class="splash-brand">GuruIndo</h1>
    <p class="splash-tagline">Sekolah dan rumah, satu hati</p>

    <div class="splash-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    // Daftarkan service worker — syarat agar browser memunculkan prompt "Pasang"
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {})
      })
    }
  </script>
</body>
</html>
