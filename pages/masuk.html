<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#534AB7">
  <title>GuruIndo — Masuk</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="apple-touch-icon" href="../favicon.svg">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background: white; }
    .auth-wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px 32px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }
    .auth-logo-teks {
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--ungu);
    }
    .auth-judul {
      font-size: 23px;
      font-weight: 600;
      color: var(--teks-utama);
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px;
      color: var(--teks-muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }
    .form-grup { display: flex; flex-direction: column; gap: 14px; }
    .lupa-sandi {
      font-size: 13px;
      color: var(--ungu);
      text-align: right;
      margin-top: -6px;
      cursor: pointer;
      font-weight: 600;
    }
    .pemisah {
      display: flex; align-items: center; gap: 12px; margin-top: 24px;
    }
    .pemisah-garis { flex: 1; height: 1px; background: var(--garis); }
    .pemisah-teks  { font-size: 13px; color: var(--teks-ringan); }
    .btn-google {
      width: 100%; margin-top: 14px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 13px 20px; border-radius: var(--radius-bulat);
      border: 1.5px solid var(--garis); background: white;
      font-size: 15px; font-weight: 600; font-family: 'Nunito', sans-serif;
      color: var(--teks-utama); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .btn-google:active { background: var(--bg-abu); }
  </style>
</head>
<body>
<div class="auth-wrap">

  <!-- Logo -->
  <div class="auth-logo">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <rect width="36" height="36" rx="9" fill="#534AB7"/>
      <path d="M23.2 13.22 C21.94 11.81 20.11 10.97 18 10.97 C14.06 10.97 10.97 14.13 10.97 18 C10.97 21.87 14.06 25.03 18 25.03 C21.09 25.03 23.77 22.99 24.68 20.11 H18.42"
        stroke="white" stroke-width="3.23"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="18" cy="18" r="2.11" fill="#1D9E75"/>
    </svg>
    <span class="auth-logo-teks">GuruIndo</span>
  </div>

  <!-- Judul dinamis -->
  <div id="jdl-daftar" style="display:none">
    <h1 class="auth-judul">Selamat datang 👋</h1>
    <p class="auth-sub">Buat akun untuk mulai menghubungkan sekolah dan rumah.</p>
  </div>
  <div id="jdl-masuk">
    <h1 class="auth-judul">Senang berjumpa lagi 😊</h1>
    <p class="auth-sub">Silakan masuk untuk melanjutkan.</p>
  </div>

  <!-- Tab daftar / masuk -->
  <div class="tab-wrap" style="margin-bottom:24px">
    <div class="tab" id="tab-daftar" onclick="ganti('daftar')">Daftar</div>
    <div class="tab aktif" id="tab-masuk" onclick="ganti('masuk')">Masuk</div>
  </div>

  <!-- Kotak error -->
  <div class="error-kotak" id="err" style="margin-bottom:16px"></div>

  <!-- Form daftar -->
  <div id="fdaftar" style="display:none">
    <div class="form-grup">
      <div class="input-grup">
        <label class="input-label">Siapa nama Bapak/Ibu?</label>
        <input class="input-field" type="text" id="d-nama"
          placeholder="Tulis nama di sini" autocomplete="name">
      </div>
      <div class="input-grup">
        <label class="input-label">Email Bapak/Ibu</label>
        <input class="input-field" type="email" id="d-email"
          placeholder="email@contoh.com" autocomplete="email">
        <div style="font-size:12px; color:var(--teks-muted); margin-top:6px; line-height:1.5">
          Email yang sudah ada di HP juga boleh dipakai.
        </div>
      </div>
      <div class="input-grup">
        <label class="input-label">Buat kata sandi</label>
        <input class="input-field" type="password" id="d-sandi"
          placeholder="Minimal 8 huruf/angka" autocomplete="new-password">
        <div style="font-size:12px; color:var(--teks-muted); margin-top:6px; line-height:1.5">
          Pakai yang mudah Bapak/Ibu ingat, ya.
        </div>
      </div>
      <button class="btn btn-utama btn-blok" style="margin-top:4px"
        onclick="daftar()">Buat akun saya</button>
    </div>
  </div>

  <!-- Form masuk -->
  <div id="fmasuk">
    <div class="form-grup">
      <div class="input-grup">
        <label class="input-label">Email</label>
        <input class="input-field" type="email" id="m-email"
          placeholder="email@contoh.com" autocomplete="email">
      </div>
      <div class="input-grup">
        <label class="input-label">Kata sandi</label>
        <input class="input-field" type="password" id="m-sandi"
          placeholder="Kata sandi kamu" autocomplete="current-password">
        <div class="lupa-sandi" onclick="lupaSandi()">Lupa kata sandi?</div>
      </div>
      <button class="btn btn-utama btn-blok" style="margin-top:4px"
        onclick="masuk()">Masuk</button>
    </div>
  </div>

  <!-- Pemisah + Google (berlaku untuk daftar & masuk) -->
  <div class="pemisah">
    <div class="pemisah-garis"></div>
    <span class="pemisah-teks">atau</span>
    <div class="pemisah-garis"></div>
  </div>
  <button class="btn-google" id="btn-google" onclick="masukGoogle()">
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Lanjutkan dengan Google
  </button>

</div>

<script type="module">
  import { supabase } from '../js/supabase.js'
  import { toast, loading } from '../js/ui.js'

  // Kalau sudah login, redirect langsung
  const { data: { session } } = await supabase.auth.getSession()
  if (session) { window.location.href = '../index.html'; }

  function err(pesan) {
    const el = document.getElementById('err')
    el.textContent = pesan
    el.classList.add('tampil')
  }
  function clearErr() {
    document.getElementById('err').classList.remove('tampil')
  }

  window.ganti = function(tab) {
    const d = tab === 'daftar'
    document.getElementById('tab-daftar').classList.toggle('aktif', d)
    document.getElementById('tab-masuk').classList.toggle('aktif', !d)
    document.getElementById('fdaftar').style.display = d ? 'block' : 'none'
    document.getElementById('fmasuk').style.display  = d ? 'none' : 'block'
    document.getElementById('jdl-daftar').style.display = d ? 'block' : 'none'
    document.getElementById('jdl-masuk').style.display  = d ? 'none' : 'block'
    clearErr()
  }

  window.daftar = async function() {
    const nama  = document.getElementById('d-nama').value.trim()
    const email = document.getElementById('d-email').value.trim()
    const sandi = document.getElementById('d-sandi').value
    clearErr()

    if (!nama)          return err('Namanya belum diisi nih, Pak/Bu.')
    if (!email)         return err('Emailnya belum diisi nih, Pak/Bu.')
    if (sandi.length < 8) return err('Kata sandi minimal 8 huruf/angka ya.')

    loading(true, 'Membuat akun...')
    const { data, error } = await supabase.auth.signUp({
      email, password: sandi,
      options: { data: { nama } }
    })
    loading(false)

    if (error) {
      if (error.message.includes('already registered'))
        return err('Email ini sudah terdaftar. Coba masuk ya.')
      return err('Aduh, ada yang tidak beres. Coba lagi ya?')
    }

    // Simpan nama sementara untuk pilih-peran
    localStorage.setItem('gi_nama_tmp', nama)

    if (data.session) {
      // Email confirmation dimatikan — langsung lanjut
      toast('Akun berhasil dibuat! 🎉', 'sukses')
      setTimeout(() => { window.location.href = 'pilih-peran.html' }, 700)
    } else {
      // Email confirmation aktif — minta cek inbox
      toast('Cek emailmu untuk konfirmasi dulu ya 📩', 'info')
      document.getElementById('fdaftar').innerHTML = `
        <div style="text-align:center;padding:20px 0">
          <div style="font-size:48px;margin-bottom:12px">📩</div>
          <p style="font-size:14px;color:var(--teks-muted);line-height:1.6">
            Link konfirmasi sudah dikirim ke <strong>${email}</strong>.<br>
            Klik link di email lalu buka app lagi ya.
          </p>
        </div>
      `
    }
  }

  window.masuk = async function() {
    const email = document.getElementById('m-email').value.trim()
    const sandi = document.getElementById('m-sandi').value
    clearErr()

    if (!email) return err('Email belum diisi nih.')
    if (!sandi) return err('Kata sandi belum diisi nih.')

    loading(true, 'Sedang masuk...')
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: sandi })
    loading(false)

    if (error) {
      if (error.message.includes('Invalid login'))
        return err('Email atau kata sandi kurang tepat.')
      if (error.message.includes('Email not confirmed'))
        return err('Email belum dikonfirmasi. Cek inbox dulu ya.')
      return err('Aduh, ada yang tidak beres. Coba lagi ya?')
    }

    // Cek apakah sudah punya profil
    const { data: profil } = await supabase
      .from('profil').select('peran').eq('id', data.user.id).maybeSingle()

    if (!profil) {
      window.location.href = 'pilih-peran.html'
    } else if (profil.peran === 'guru') {
      window.location.href = 'beranda-guru.html'
    } else {
      window.location.href = 'beranda-ortu.html'
    }
  }

  window.lupaSandi = async function() {
    const email = document.getElementById('m-email').value.trim()
    if (!email) return err('Isi email dulu, nanti kami kirim link reset.')
    loading(true, 'Mengirim email...')
    const { error } = await supabase.auth.resetPasswordForEmail(email)
    loading(false)
    if (error) return err('Gagal kirim email. Coba lagi ya?')
    toast('Link reset sudah dikirim! Cek inbox kamu 📩', 'sukses')
  }

  window.masukGoogle = async function() {
    const btn = document.getElementById('btn-google')
    btn.disabled = true
    btn.textContent = 'Menghubungkan...'
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: 'https://guruindo.github.io/pages/masuk.html' }
    })
    if (error) {
      btn.disabled = false
      btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Lanjutkan dengan Google`
      err('Gagal membuka Google. Coba lagi ya.')
    }
    // Kalau berhasil: browser redirect ke Google, tidak perlu handle di sini
  }

  // Enter key
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return
    const daftarVisible = document.getElementById('fdaftar').style.display !== 'none'
    daftarVisible ? window.daftar() : window.masuk()
  })
</script>
</body>
</html>
