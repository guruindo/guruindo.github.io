<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#534AB7">
  <title>GuruIndo — Beranda</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background: var(--bg-abu); }

    /* ── Header ── */
    .header {
      background: var(--ungu);
      padding: 48px max(20px, calc((100% - 480px) / 2)) 20px;
      padding-top: calc(48px + env(safe-area-inset-top));
    }
    .header-baris {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .logo-kecil {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.18);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px;
    }
    .sapaan   { color: rgba(255,255,255,0.75); font-size: 13px; }
    .nama-user {
      color: white; font-size: 18px; font-weight: 600;
      margin-top: 3px; max-width: 220px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-avatar {
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0; margin-top: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .chip-status {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px; padding: 5px 13px;
      font-size: 12px; color: white; font-weight: 500;
      margin-top: 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border: none;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
    .dot-hijau { background: #4ADE80; }
    .dot-abu   { background: rgba(255,255,255,0.45); }

    /* ── Konten ── */
    .konten {
      padding: 16px;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }
    .seksi-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin: 16px 0 10px;
    }
    .seksi-judul {
      font-size: 13px; font-weight: 600;
      color: var(--teks-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .link-lihat-semua {
      font-size: 12px; color: var(--ungu); font-weight: 600;
      background: none; border: none; cursor: pointer; padding: 0;
    }

    /* ── Kartu kelas ── */
    .kartu-kelas {
      background: white; border-radius: var(--radius-besar);
      padding: 14px 16px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 14px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    .kartu-kelas:active { transform: scale(0.98); }
    .ikon-kelas {
      width: 46px; height: 46px; border-radius: 13px;
      background: #EEEDFE;
      display: flex; align-items: center; justify-content: center;
      font-size: 21px; flex-shrink: 0;
    }
    .info-kelas { flex: 1; min-width: 0; }
    .nama-kelas {
      font-size: 14px; font-weight: 600; color: var(--teks-utama);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .meta-kelas {
      font-size: 12px; color: var(--teks-muted); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .badge-wali {
      font-size: 10px; background: #EEEDFE; color: var(--ungu);
      padding: 3px 8px; border-radius: 20px; font-weight: 600;
      white-space: nowrap; flex-shrink: 0;
    }

    /* ── Skeleton loading ── */
    .skeleton {
      background: linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite;
      border-radius: var(--radius-besar);
      height: 74px; margin-bottom: 10px;
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* ── Bottom navigation ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; border-top: 1px solid var(--garis);
      display: flex; z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav-inner { display: flex; width: 100%; max-width: 480px; margin: 0 auto; }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; padding: 10px 6px;
      border: none; background: none; cursor: pointer;
      gap: 3px; opacity: 0.4;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item.aktif { opacity: 1; }
    .nav-icon  { font-size: 20px; line-height: 1; }
    .nav-label {
      font-size: 10px; font-weight: 600;
      color: var(--teks-muted); font-family: 'Nunito', sans-serif;
    }
    .nav-item.aktif .nav-label { color: var(--ungu); }

    /* ── Bottom sheet menu profil ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.38); z-index: 100;
    }
    .panel {
      display: none; position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      z-index: 101;
    }
    .handle {
      width: 36px; height: 4px; background: #E5E7EB;
      border-radius: 2px; margin: 0 auto 20px;
    }
    .profil-box {
      display: flex; align-items: center; gap: 12px;
      background: #F9F9FF; border-radius: 12px;
      padding: 12px; margin-bottom: 12px;
    }
    .avatar-besar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--ungu);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: white; flex-shrink: 0;
    }
    .profil-nama  { font-size: 14px; font-weight: 600; color: var(--teks-utama); }
    .profil-email { font-size: 12px; color: var(--teks-muted); margin-top: 1px; }
    .profil-peran {
      font-size: 11px; color: var(--ungu); font-weight: 600; margin-top: 3px;
    }
  </style>
</head>
<body>

<!-- ── HEADER ────────────────────────────────── -->
<div class="header">
  <div class="header-baris">
    <div>
      <div class="logo-kecil">
        <svg width="17" height="17" viewBox="0 0 36 36" fill="none">
          <path d="M9 27L18 11L27 27" stroke="white" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13 21L23 21" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="sapaan" id="el-sapaan">Memuat...</div>
      <div class="nama-user" id="el-nama">—</div>
    </div>
    <button class="btn-avatar" id="btn-avatar" aria-label="Profil">👤</button>
  </div>

  <!-- Chip mode: aktif / tidak aktif terima pesan -->
  <button class="chip-status" id="chip-status" title="Ketuk untuk ubah status">
    <span class="dot dot-hijau" id="dot-status"></span>
    <span id="teks-status">Siap dihubungi ortu</span>
  </button>
</div>

<!-- ── KONTEN ─────────────────────────────────── -->
<div class="konten">

  <div class="seksi-header">
    <span class="seksi-judul">Kelas Saya</span>
  </div>

  <!-- Skeleton saat loading -->
  <div id="el-loading">
    <div class="skeleton"></div>
    <div class="skeleton" style="opacity:0.6"></div>
  </div>

  <!-- Daftar kelas (diisi JavaScript) -->
  <div id="el-daftar" style="display:none"></div>

  <!-- Empty state: belum ada kelas -->
  <div id="el-kosong" class="state-kosong" style="display:none">
    <div class="state-ikon">🏫</div>
    <div class="state-judul">Belum ada kelas</div>
    <div class="state-teks">
      Daftarkan sekolah dan kelas pertamamu. Setelah itu, bagikan kode ke muridmu agar orang tua bisa terhubung.
    </div>
    <button class="btn btn-utama" onclick="window.location.href='daftar-kelas.html'">
      + Daftarkan Kelas
    </button>
  </div>

  <!-- Error state -->
  <div id="el-error" class="state-kosong" style="display:none">
    <div class="state-ikon">😕</div>
    <div class="state-judul">Koneksi bermasalah</div>
    <div class="state-teks">Tidak bisa memuat daftar kelas. Cek koneksi internet kamu, lalu coba lagi.</div>
    <button class="btn btn-utama" onclick="muatKelas()">Coba Lagi</button>
  </div>

</div>

<!-- ── BOTTOM NAV ─────────────────────────────── -->
<nav class="bottom-nav" role="navigation">
  <div class="bottom-nav-inner">
  <button class="nav-item aktif" aria-current="page">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">Beranda</span>
  </button>
  <button class="nav-item" onclick="window.location.href='pengumuman.html'">
    <span class="nav-icon">📢</span>
    <span class="nav-label">Pengumuman</span>
  </button>
  <button class="nav-item" onclick="window.location.href='absensi.html'">
    <span class="nav-icon" style="position:relative">✅<span id="badge-pengajuan" style="display:none;position:absolute;top:-6px;right:-10px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#DC2626;color:white;font-size:10px;font-weight:700;line-height:16px;text-align:center;font-family:'Nunito',sans-serif">0</span></span>
    <span class="nav-label">Absensi</span>
  </button>
  <button class="nav-item" onclick="window.location.href='catatan-list.html'">
    <span class="nav-icon">💬</span>
    <span class="nav-label">Catatan</span>
  </button>
  <button class="nav-item" id="btn-nav-profil">
    <span class="nav-icon">👤</span>
    <span class="nav-label">Profil</span>
  </button>
  </div>
</nav>

<!-- ── BOTTOM SHEET PROFIL ────────────────────── -->
<div class="overlay" id="el-overlay"></div>
<div class="panel" id="el-panel">
  <div class="handle"></div>

  <div class="profil-box">
    <div class="avatar-besar">👤</div>
    <div>
      <div class="profil-nama"  id="menu-nama">—</div>
      <div class="profil-email" id="menu-email">—</div>
      <div class="profil-peran">Guru / Pendidik</div>
    </div>
  </div>

  <button class="btn" style="width:100%;justify-content:center;
    color:#EF4444;border:1.5px solid #FEE2E2;margin-top:4px"
    id="btn-keluar">
    Keluar dari GuruIndo
  </button>
</div>

<script type="module">
  import { supabase } from '../js/supabase.js'
  import { toast } from '../js/ui.js'

  // Semua kode dibungkus fungsi async agar 'return' untuk redirect legal
  ;(async () => {

  // ── 1. Cek sesi ──────────────────────────────────
  const { data: { user } } = await supabase.auth.getUser()
  if (!user) {
    window.location.href = 'masuk.html'
    return
  }

  // ── 2. Ambil profil ──────────────────────────────
  const { data: profil, error: errProfil } = await supabase
    .from('profil')
    .select('nama, peran, terima_chat')
    .eq('id', user.id)
    .maybeSingle()

  if (!profil) {
    // Profil belum dibuat (misalnya gagal di tengah alur)
    window.location.href = 'pilih-peran.html'
    return
  }

  if (profil.peran === 'ortu') {
    // Akun ini ortu, salah halaman
    window.location.href = 'beranda-ortu.html'
    return
  }

  // ── 3. Tampilkan sapaan & nama ───────────────────
  const jam    = new Date().getHours()
  const sapaan = jam < 11 ? 'Selamat pagi ☀️'
    : jam < 15 ? 'Selamat siang 🌤️'
    : jam < 18 ? 'Selamat sore 🌅'
    : 'Selamat malam 🌙'

  document.getElementById('el-sapaan').textContent  = sapaan
  document.getElementById('el-nama').textContent    = profil.nama
  document.getElementById('menu-nama').textContent  = profil.nama
  document.getElementById('menu-email').textContent = user.email

  // ── 4. Muat daftar kelas ─────────────────────────
  async function muatKelas() {
    document.getElementById('el-loading').style.display = 'block'
    document.getElementById('el-daftar').style.display  = 'none'
    document.getElementById('el-kosong').style.display  = 'none'
    document.getElementById('el-error').style.display   = 'none'

    const { data, error } = await supabase
      .from('guru_kelas')
      .select(`
        is_wali, mapel,
        kelas (
          id, nama_kelas, tahun_ajaran,
          sekolah ( nama )
        )
      `)
      .eq('guru_id', user.id)

    document.getElementById('el-loading').style.display = 'none'

    if (error) {
      document.getElementById('el-error').style.display = 'block'
      return
    }

    if (!data || data.length === 0) {
      document.getElementById('el-kosong').style.display = 'block'
      return
    }

    const kontainer = document.getElementById('el-daftar')
    kontainer.innerHTML = ''
    kontainer.style.display = 'block'

    data.forEach(gk => {
      const k       = gk.kelas
      const sekolah = k.sekolah?.nama || ''
      const tahun   = k.tahun_ajaran  ? ' · ' + k.tahun_ajaran : ''

      const el = document.createElement('div')
      el.className = 'kartu-kelas'
      el.innerHTML = `
        <div class="ikon-kelas">🏫</div>
        <div class="info-kelas">
          <div class="nama-kelas">${k.nama_kelas}</div>
          <div class="meta-kelas">${sekolah}${tahun}</div>
        </div>
        ${gk.is_wali ? '<span class="badge-wali">Wali Kelas</span>' : ''}
      `
      el.addEventListener('click', () => {
        window.location.href = 'kelas.html?id=' + k.id
      })
      kontainer.appendChild(el)
    })
  }

  // Panggil saat halaman dimuat
  muatKelas()

  // Buat muatKelas bisa dipanggil dari tombol "Coba Lagi"
  window.muatKelas = muatKelas

  // ── 5. Fungsi UI ─────────────────────────────────

  // Tampilkan notif "fitur segera hadir"
  window.nanti = function(nama) {
    toast(`${nama} akan hadir segera 🌱`, 'info')
  }

  // Buka/tutup panel profil
  function bukaPanel() {
    document.getElementById('el-overlay').style.display = 'block'
    document.getElementById('el-panel').style.display   = 'block'
  }
  function tutupPanel() {
    document.getElementById('el-overlay').style.display = 'none'
    document.getElementById('el-panel').style.display   = 'none'
  }

  document.getElementById('btn-avatar').addEventListener('click', bukaPanel)
  document.getElementById('btn-nav-profil').addEventListener('click', bukaPanel)
  document.getElementById('el-overlay').addEventListener('click', tutupPanel)

  // Badge pengajuan izin/sakit yang menunggu (di ikon Absensi)
  async function muatBadgePengajuan() {
    const { data, error } = await supabase.rpc('pengajuan_menunggu_guru')
    if (error) return
    const n = Number(data) || 0
    const badge = document.getElementById('badge-pengajuan')
    if (n > 0) { badge.textContent = n > 9 ? '9+' : String(n); badge.style.display = 'block' }
    else { badge.style.display = 'none' }
  }
  muatBadgePengajuan()

  // ── Realtime: badge pengajuan update sendiri saat ortu kirim/ubah ──
  // Subscribe seluruh tabel pengajuan_izin; angka final tetap dihitung
  // RPC pengajuan_menunggu_guru (sudah RLS-aware, hanya kelas guru ini).
  // Lapisan tambahan; muatBadgePengajuan() awal tetap fallback (no regresi).
  let chPengajuan = null
  try {
    chPengajuan = supabase
      .channel('rt-pengajuan-' + user.id)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'pengajuan_izin' },
        () => muatBadgePengajuan()
      )
      .subscribe()
  } catch (_) { /* realtime gagal != app rusak */ }

  function lepasRealtime() {
    if (chPengajuan) { supabase.removeChannel(chPengajuan); chPengajuan = null }
  }
  window.addEventListener('pagehide', lepasRealtime)
  window.addEventListener('beforeunload', lepasRealtime)

  // Keluar
  document.getElementById('btn-keluar').addEventListener('click', async () => {
    await supabase.auth.signOut()
    window.location.href = '../index.html'
  })

  // Chip status — saklar global "terima balasan ortu" (terima_chat)
  const chip       = document.getElementById('chip-status')
  const dotStatus  = document.getElementById('dot-status')
  const teksStatus = document.getElementById('teks-status')

  function gambarStatus(aktif) {
    if (aktif) {
      dotStatus.className = 'dot dot-hijau'
      teksStatus.textContent = 'Siap dihubungi ortu'
    } else {
      dotStatus.className = 'dot dot-abu'
      teksStatus.textContent = 'Mode tenang — balasan ditahan'
    }
  }
  gambarStatus(profil.terima_chat !== false)

  chip.addEventListener('click', async () => {
    const target = (profil.terima_chat === false) // sedang off -> mau nyalakan
    chip.style.pointerEvents = 'none'
    const { error } = await supabase.rpc('set_terima_chat', { p_aktif: target })
    chip.style.pointerEvents = 'auto'
    if (error) { toast('Gagal mengubah status. Coba lagi.', 'error'); return }
    profil.terima_chat = target
    gambarStatus(target)
    toast(target ? 'Sekarang menerima balasan ortu 😊' : 'Balasan ortu ditahan untuk sementara', 'info')
  })

  })()  // <- tutup fungsi async
</script>

<!-- Banner pasang PWA (muncul otomatis hanya jika browser mendukung & belum terpasang) -->
<div id="pwa-banner" style="display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:calc(72px + env(safe-area-inset-bottom)); z-index:60; max-width:480px; width:calc(100% - 32px);">
  <button id="pwa-pasang" style="width:100%; padding:12px; border:none; border-radius:14px; background:#534AB7; color:white; font-size:14px; font-weight:600; font-family:'Nunito',sans-serif; box-shadow:0 6px 20px rgba(83,74,183,0.35); cursor:pointer; -webkit-tap-highlight-color:transparent;">📲 Pasang GuruIndo</button>
</div>
<script>
  (function(){
    let deferred = null
    const banner = document.getElementById('pwa-banner')
    const tombol = document.getElementById('pwa-pasang')
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferred = e; banner.style.display = 'block'
    })
    tombol.addEventListener('click', async () => {
      if (!deferred) return
      deferred.prompt()
      await deferred.userChoice
      deferred = null; banner.style.display = 'none'
    })
    window.addEventListener('appinstalled', () => { banner.style.display = 'none' })
  })()
</script>
</body>
</html>
