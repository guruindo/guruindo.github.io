<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#534AB7">
  <title>GuruIndo — Offline</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }
    .konten {
      text-align: center;
      padding: 40px 32px;
      max-width: 320px;
    }
    .ikon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 20px; color: var(--teks-utama); margin-bottom: 10px; }
    p { font-size: 14px; color: var(--teks-muted); line-height: 1.6; margin-bottom: 28px; }
    button {
      padding: 13px 28px;
      background: var(--ungu);
      color: white;
      border-radius: 999px;
      font-size: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="konten">
    <div class="ikon">🌐</div>
    <h1>Koneksi terputus</h1>
    <p>Sepertinya internet anda sedang tidak aktif. Sambungkan dulu ya — halaman akan otomatis terbuka begitu koneksi kembali.</p>
    <button id="btn-coba">Coba lagi</button>
    <p id="status-offline" style="margin-top:14px;margin-bottom:0;font-size:13px;color:var(--teks-ringan);min-height:18px"></p>
  </div>
  <script>
    var btn = document.getElementById('btn-coba')
    var stat = document.getElementById('status-offline')

    function cobaLagi() {
      if (navigator.onLine === false) {
        stat.textContent = 'Masih offline — menunggu koneksi kembali...'
        return
      }
      stat.textContent = 'Menyambungkan...'
      location.reload()
    }

    btn.addEventListener('click', cobaLagi)

    // Auto-pulih: begitu browser mendeteksi online lagi, muat ulang sendiri.
    window.addEventListener('online', function () {
      stat.textContent = 'Koneksi kembali — memuat ulang...'
      location.reload()
    })
  </script>
</body>
</html>
